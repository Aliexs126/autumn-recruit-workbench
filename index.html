<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秋招信息工作台 · 2027届</title>
<style>
  :root{
    --cream:#FAF8F3; --cream2:#F3EEE5; --panel:#FFFFFF;
    --ink:#2E2A33; --muted:#8A8493; --line:#ECE5DA;
    --purple:#E7DEF7; --purple-d:#B49BDB; --purple-deep:#6E52A6;
    --coral:#FF7A66; --coral-d:#E85C47; --coral-soft:#FFE6E0;
    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:linear-gradient(180deg,#EFE7FA,#E3D8F3);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-family:var(--serif);font-size:22px;font-weight:800;color:var(--purple-deep);margin-bottom:4px;line-height:1.25}
  .brand small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:11px 12px;border-radius:12px;font-size:14px;cursor:pointer;font-family:var(--sans);transition:background-color 150ms ease,transform 150ms var(--ease-out),box-shadow 150ms ease}
  .nav-btn .ic{font-size:16px;width:20px;text-align:center}
  .nav-btn:hover{background:rgba(255,255,255,.55)}
  .nav-btn:active{transform:scale(0.98)}
  .nav-btn.active{background:#fff;color:var(--purple-deep);font-weight:700;box-shadow:0 4px 14px rgba(110,82,166,.12)}
  .side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding-top:14px;border-top:1px solid rgba(110,82,166,.18)}
  .main{padding:26px 30px 60px;overflow:auto}
  h1,h2,h3{font-family:var(--serif);font-weight:800}
  .page-title{font-size:26px;margin:0 0 2px}
  .page-sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .page{display:none}.page.show{display:block;animation:fade .18s var(--ease-out)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(110,82,166,.05);transition:box-shadow 220ms var(--ease-out),transform 220ms var(--ease-out),border-color 200ms ease}
  @media(hover:hover) and (pointer:fine){.card:hover{box-shadow:0 12px 32px rgba(110,82,166,.12);transform:translateY(-2px);border-color:var(--purple-d)}.rec-item:hover{box-shadow:0 10px 26px rgba(232,92,71,.14);transform:translateY(-2px)}.qitem:hover{border-color:var(--purple-d)}}
  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .stat .n{font-family:var(--serif);font-size:30px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12px}
  .stat.coral .n{color:var(--coral-d)}.stat.soe .n{color:var(--purple-deep)}.stat.purple{background:linear-gradient(135deg,#F3ECFB,#E7DEF7)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  select,input,textarea{font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--purple-d);border-color:var(--purple-d)}
  textarea{resize:vertical;width:100%}
  .btn{border:0;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600;background:var(--purple-deep);color:#fff;transition:transform 150ms var(--ease-out),background-color 150ms ease,filter 150ms ease}
  .btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(0.97)}
  .btn.coral{background:var(--coral)}.btn.coral:hover{background:var(--coral-d)}.btn.coral:active{transform:scale(0.97)}
  .btn.ghost{background:#fff;color:var(--purple-deep);border:1px solid var(--purple-d)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .badge-soe{background:#EDE4FA;color:#6E52A6}.badge-net{background:var(--coral-soft);color:var(--coral-d)}
  .st-open{color:#3a9d6b;font-weight:700}.st-urgent{color:var(--coral-d);font-weight:800}.st-closed{color:#a59db3}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--purple-deep);background:var(--cream2);position:sticky;top:0}
  tr:hover td{background:#FBF7FF}
  .src-link{display:inline-block;background:var(--coral-soft);color:var(--coral-d);border:1px solid var(--coral);padding:5px 12px;border-radius:20px;font-weight:700;text-decoration:none;font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  .src-link:hover{background:var(--coral);color:#fff}
  .tip{background:var(--coral-soft);border:1px solid var(--coral);color:var(--coral-d);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;font-weight:600}
  .muted{color:var(--muted);font-size:12px}
  .note{color:var(--muted);font-size:11px}
  .rec-card{background:linear-gradient(135deg,#FBEDE7,#F4ECFB);border:1px solid var(--coral-soft);border-radius:16px;padding:16px 18px;margin:6px 0 18px}
  .rec-head{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px}
  .rec-head .muted{font-size:11.5px;font-weight:400;margin-left:8px}
  .rec-item{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:box-shadow 220ms var(--ease-out),transform 220ms var(--ease-out),border-color 200ms ease}
  .rec-item:last-child{margin-bottom:0}
  .rec-main b{font-family:var(--serif);font-size:15px}
  .rec-pos{font-size:14px;font-weight:600;color:var(--coral-d);margin-top:3px}
  .rec-acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:96px}
  .rec-acts .btn{white-space:nowrap}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--cream2);margin:2px 4px 2px 0}
  .pill.on{background:var(--coral);color:#fff}
  .pipeline{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .stage{flex:1;min-width:110px;background:var(--cream2);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}
  .stage b{display:block;font-size:20px;font-family:var(--serif);color:var(--ink)}
  .stage.active{background:var(--purple);color:var(--purple-deep)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>.col{flex:1;min-width:280px}
  .kv{font-size:13px;margin:4px 0}
  .kv b{color:var(--purple-deep)}
  .modal-bg{position:fixed;inset:0;background:rgba(46,42,51,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 200ms var(--ease-out),visibility 200ms var(--ease-out)}
  .modal-bg.show{opacity:1;visibility:visible;pointer-events:auto}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:86vh;overflow:auto;transform:scale(0.96);opacity:0;transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
  .modal-bg.show .modal{transform:scale(1);opacity:1}
  .modal h3{margin-top:0}
  .field{margin:8px 0}
  .field label{display:block;font-size:12px;color:var(--purple-deep);font-weight:700;margin-bottom:3px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,12px);background:var(--purple-deep);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out);z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
  .qitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff;transition:border-color 200ms ease}
  .qitem .q{font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .qitem .a{margin-top:8px}
  @media(max-width:860px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px}.brand{width:100%}.nav-btn{flex:1 1 auto;justify-content:center;padding:8px 10px;font-size:12.5px}.side .foot{display:none}.main{padding:18px 16px 50px}.grid-stats{grid-template-columns:repeat(2,1fr)}}
  :focus-visible{outline:2px solid var(--coral-d);outline-offset:2;border-radius:8px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-property:opacity!important}.page.show{animation:none}.btn:active,.nav-btn:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">秋招工作台<small>2027届</small></div>
    <button class="nav-btn active" data-page="pool"><span class="ic">🗂️</span>信息池看板</button>
    <button class="nav-btn" data-page="jobs"><span class="ic">📋</span>岗位管理</button>
    <button class="nav-btn" data-page="interview"><span class="ic">🎤</span>面试进度</button>
    <div class="foot">数据本地存储于浏览器<br>看板与 JSON 同目录自动刷新</div>
  </aside>
  <main class="main">
    <section class="page show" id="page-pool">
      <h1 class="page-title">信息池看板</h1>
      <p class="page-sub">每日 8:00 自动搜集更新 · 仅 2027 届 · 已排除社招 · 来源：国资委 / 中国公共招聘网 / 国聘网 / 各集团与大厂官网</p>
      <div class="rec-card" id="dailyRec"></div>
      <div class="grid-stats" id="poolStats"></div>
      <div class="toolbar">
        <select id="fCat"><option value="">全部类别</option><option value="央国企">央国企</option><option value="互联网大厂">互联网大厂</option></select>
        <select id="fStatus"><option value="">全部状态</option><option value="open">报名中</option><option value="urgent">即将截止</option><option value="closed">已截止</option></select>
        <input id="fSearch" placeholder="搜索单位 / 岗位 / 关键词" style="flex:1;min-width:180px">
        <button class="btn ghost" id="btnRefresh">↻ 刷新数据</button>
      </div>
      <div class="card" style="padding:0;overflow:auto"><table id="poolTable"><thead><tr><th>单位</th><th>岗位 / 项目</th><th>类别</th><th>批次</th><th>截止</th><th>状态</th><th>来源 / 发布</th><th>操作</th></tr></thead><tbody></tbody></table></div>
    </section>
    <section class="page" id="page-jobs">
      <h1 class="page-title">岗位管理</h1>
      <p class="page-sub">自动抓取（信息池一键录入）+ 手动补充 · 全链路追踪</p>
      <div class="pipeline" id="pipeline"></div>
      <div class="toolbar">
        <button class="btn coral" id="btnAddJob">+ 手动新增岗位</button>
        <button class="btn ghost" id="btnCopyJobs">📋 复制全部行</button>
        <select id="jfStatus"><option value="">按状态筛选</option><option>未投递</option><option>已投递</option><option>笔试中</option><option>面试中</option><option>offer</option><option>已拒绝</option></select>
        <input id="jfSearch" placeholder="搜索单位 / 岗位" style="flex:1;min-width:160px">
      </div>
      <div class="card" style="padding:0;overflow:auto"><table id="jobsTable"><thead><tr><th>单位</th><th>岗位</th><th>类别</th><th>截止</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody></tbody></table></div>
    </section>
    <section class="page" id="page-interview">
      <h1 class="page-title">面试进度</h1>
      <p class="page-sub">统一记录每场面试的问题与复盘</p>
      <div class="tip">💡 面试准备交给 WorkBuddy：把新收到的 JD 发给他，他会结合记忆里你的简历，直接产出专属面试准备 / 模拟电话排练指令。</div>
      <div class="toolbar"><button class="btn coral" id="btnAddInterview">+ 记录一场面试</button></div>
      <div id="interviewList"></div>
    </section>
  </main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="recruit-seed.js"></script>
